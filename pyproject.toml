[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "student-placement-prediction"
version = "1.0.0"
description = "AI/ML system for predicting student placement outcomes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]
